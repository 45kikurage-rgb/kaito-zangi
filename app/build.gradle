plugins { id 'com.android.application' }

android {
    namespace 'jp.kossacktouch.app'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.kossacktouch.app'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.1.10-test11'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signing is done separately with the owner's fixed key (scripts/build.sh).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        // JNI libraries (bundled Japanese OCR) are compressed inside the APK.
        jniLibs { useLegacyPackaging true }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
}
