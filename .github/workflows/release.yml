name: Publish signed test APK
on:
  push:
    tags: ["v0.1.5-test06"]
    branches: [fix/test06-line-registration]
    paths: ["site/downloads/kossack-touch-0.1.5-test06.apk", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify downloaded APK checksum
        working-directory: site/downloads
        run: sha256sum -c SHA256SUMS
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.5-test06 site/downloads/kossack-touch-0.1.5-test06.apk site/downloads/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title '回答ザンギ 0.1.5-test06' --notes-file docs/release-notes.md
