name: Publish signed test APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify downloaded APK checksum
        working-directory: site/downloads
        run: sha256sum -c SHA256SUMS
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-test01 site/downloads/kossack-touch-0.1.0-test01.apk site/downloads/SHA256SUMS --prerelease --title 'コサックタッチ 0.1.0-test01' --notes-file docs/release-notes.md
