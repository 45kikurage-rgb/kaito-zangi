name: Publish signed test APK
on:
  push:
    tags: ["v0.1.13-name14"]
    branches: [main, fix/test06-line-registration]
    paths: ["site/downloads/kaito-zangi-0.1.13-name14.apk", "release-assets/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/assemble-release-apk.py
      - name: Verify downloaded APK checksum
        working-directory: site/downloads
        run: sha256sum -c SHA256SUMS
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.13-name14 >/dev/null 2>&1; then
            echo 'This version is already published; preserving existing release assets.'
            exit 0
          fi
          gh release create v0.1.13-name14 site/downloads/kaito-zangi-0.1.13-name14.apk site/downloads/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title '怪盗ザンギ 0.1.13-name14' --notes-file docs/release-notes.md
