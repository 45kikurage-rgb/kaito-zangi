name: Publish signed test APK
on:
  push:
    tags: ["v0.1.9-test10"]
    branches: [main, fix/test06-line-registration]
    paths: ["site/downloads/kossack-touch-0.1.9-test10.apk", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify downloaded APK checksum
        working-directory: site/downloads
        run: sha256sum -c SHA256SUMS
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.9-test10 >/dev/null 2>&1; then
            echo 'This version is already published; preserving existing release assets.'
            exit 0
          fi
          gh release create v0.1.9-test10 site/downloads/kossack-touch-0.1.9-test10.apk site/downloads/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title '回答ザンギ 0.1.9-test10' --notes-file docs/release-notes.md
