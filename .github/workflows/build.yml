name: Verify Android and build signed APK
on:
  push:
    branches: [main, fix/test06-line-registration]
    paths: ["app/**", "scripts/**", "tests/**", "*.gradle", "gradle.properties", "gradle/**", "gradlew*", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Regression tests and Android compilation
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash scripts/compile.sh
      - uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            build/test-results.txt
            build/out/aligned.apk
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build with owner's fixed key
        env:
          KEY_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY_BASE64" || -z "$SIGNING_STORE_PASSWORD" ]]; then
            echo "::error::Fixed owner signing key is unavailable. Set SIGNING_STORE_BASE64 and SIGNING_STORE_PASSWORD using the existing kossacktouch key backup."
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kossacktouch.p12"
          export SIGNING_STORE="$RUNNER_TEMP/kossacktouch.p12"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          trap 'rm -f "$SIGNING_STORE"' EXIT
          bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kaito-zangi-test-apk
          path: |
            build/out/kaito-zangi-0.1.13-name14.apk
            build/SHA256SUMS
            build/test-results.txt
            build/signature-verification.txt
