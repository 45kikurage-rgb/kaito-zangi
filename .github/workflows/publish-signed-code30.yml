name: Publish verified owner-signed code30
on:
  push:
    branches: [main]
    paths:
      - site/downloads/kaito-zangi-0.1.30.apk
      - site/downloads/SHA256SUMS-code30.txt
      - site/releases/code30.json
      - .github/workflows/publish-signed-code30.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-signed-code30
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Verify APK, metadata and fixed owner certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=site/downloads/kaito-zangi-0.1.30.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/code30-certificate.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/code30-badging.txt"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          apk=Path('site/downloads/kaito-zangi-0.1.30.apk')
          metadata=json.loads(Path('site/latest.json').read_text())
          assert metadata == json.loads(Path('site/releases/code30.json').read_text()), 'Release metadata differs'
          expected={'version':'0.1.30','versionCode':30,'package':'jp.kossacktouch.app',
                    'channel':'stable','status':'production','apk':'downloads/'+apk.name,
                    'signingCertificateSha256':'20f8f43972be30b9b3ac94f83e3bcb8d5bf98d3c81b0b47bb7a24b19aa57d302'}
          for key,value in expected.items():
              assert metadata.get(key)==value, 'Metadata mismatch: '+key
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert metadata['sha256']==digest and metadata['sizeBytes']==apk.stat().st_size, 'APK bytes mismatch'
          checksum=f'{digest}  {apk.name}\n'
          assert Path('site/downloads/SHA256SUMS-code30.txt').read_text()==checksum, 'Release checksum mismatch'
          assert Path('site/downloads/SHA256SUMS').read_text().splitlines().count(checksum.strip())==1, 'Combined checksum mismatch'
          temporary=Path(os.environ['RUNNER_TEMP'])
          certificate=(temporary/'code30-certificate.txt').read_text()
          assert re.findall(r'^Signer #\d+ certificate SHA-256 digest: (\w+)$',certificate,re.M)==[expected['signingCertificateSha256']], 'Signer mismatch'
          badging=(temporary/'code30-badging.txt').read_text()
          assert re.search(r"^package: name='jp\.kossacktouch\.app' versionCode='30' versionName='0\.1\.30'(?: |$)",badging,re.M), 'APK package/version mismatch'
          print('code30 APK, metadata, checksums, package/version and owner certificate verified')
          PY
      - name: Create release only when absent; never replace existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, tempfile, urllib.error, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['GITHUB_SHA']; tag='v0.1.30'
          def run(*args):
              return subprocess.check_output(args,text=True).strip()
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(request) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code==404: return None
                  raise
          reference=get('git/ref/tags/'+tag)
          if reference:
              obj=reference['object']
              while obj['type']=='tag': obj=get('git/tags/'+obj['sha'])['object']
              assert obj['type']=='commit' and obj['sha']==commit, 'Existing tag targets a different commit; preserve it and stop'
          release=get('releases/tags/'+tag)
          names=['kaito-zangi-0.1.30.apk','SHA256SUMS-code30.txt']
          if release is None:
              run('gh','release','create',tag,*['site/downloads/'+name for name in names],
                  '--repo',repo,'--target',commit,'--latest','--title','怪盗ザンギ code30 実運用版',
                  '--notes-file','docs/release-notes-code30.md')
              release=get('releases/tags/'+tag)
          assert release and not release['draft'] and not release['prerelease'], 'Release state mismatch'
          assert sorted(a['name'] for a in release['assets'])==sorted(names), 'Existing assets differ; no replacement permitted'
          with tempfile.TemporaryDirectory() as directory:
              run('gh','release','download',tag,'--repo',repo,'--dir',directory)
              for name in names:
                  local=Path('site/downloads')/name; remote=Path(directory)/name
                  assert remote.stat().st_size==local.stat().st_size, 'Published size mismatch: '+name
                  assert hashlib.sha256(remote.read_bytes()).digest()==hashlib.sha256(local.read_bytes()).digest(), 'Published bytes mismatch: '+name
          print('Verified GitHub Release: '+release['html_url'])
          PY
